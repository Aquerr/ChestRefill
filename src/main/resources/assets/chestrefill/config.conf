# Defines what language will be used for plugin messages. Default: en
# Look here for available languages: https://github.com/Aquerr/ChestRefill/tree/api-8/src/main/resources/assets/chestrefill/lang
language-tag=en

# By default, Chest Refill checks for new available version online and informs about it in the server console at startup.
# Also, it informs players with "chestrefill.version.notify" permission about new version available when they join the game.
version-check=true